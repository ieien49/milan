<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Milano">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="leaflet.css">
<title>Milano</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--tx:#1b1c1e;--mu:#6b6e73;--bd:#e4e4df;--ac:#1f7a4d;--ac2:#e8f3ec;--wa:#b26a00;--wa2:#fff3df;--er:#c0392b;--er2:#fdeceb}
@media(prefers-color-scheme:dark){:root{--bg:#111214;--card:#1a1c1f;--tx:#ececec;--mu:#9a9da3;--bd:#2a2d31;--ac:#46c28a;--ac2:#18312a;--wa:#f0b04a;--wa2:#3a2d14;--er:#ff7b6b;--er2:#3a1e1b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 90px)}
h1{font-size:24px;margin:0 0 4px}h2{font-size:15px;margin:22px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--mu);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:0 0 8px}
.row{display:flex;gap:10px;align-items:flex-start}
.row .grow{flex:1;min-width:0}
.t{font-weight:600}.d{color:var(--mu);font-size:13px;margin-top:2px}
.done .t{text-decoration:line-through;color:var(--mu)}
.chip{display:inline-block;font-size:12px;border-radius:99px;padding:2px 8px;margin:4px 6px 0 0;background:var(--ac2);color:var(--ac)}
.chip.w{background:var(--wa2);color:var(--wa)}.chip.e{background:var(--er2);color:var(--er)}
input[type=checkbox]{width:24px;height:24px;margin:1px 0 0;accent-color:var(--ac);flex:none}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=date],select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:0 0 8px}
input[type=date]{min-height:42px}
.btn{display:block;width:100%;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;margin:0 0 8px}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.r{background:var(--er2);color:var(--er)}
.x{background:none;border:0;color:var(--mu);font-size:20px;padding:0 4px;line-height:1}
.dd{font-size:12px;padding:4px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-top:6px;width:auto}
.hero{background:var(--ac);color:#fff;border-radius:16px;padding:16px;margin:0 0 6px}
.hero b{font-size:28px;display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;background:none;border:0;padding:8px 0;font-size:9.5px;color:var(--mu)}
nav button svg{display:block;margin:0 auto 2px}
#big{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;justify-content:center;padding:24px;text-align:center}
#big[hidden]{display:none}
#big .it{font-size:34px;font-weight:700;line-height:1.2}
#big .fr{color:var(--mu);margin-top:16px;font-size:15px}
nav button.on{color:var(--ac);font-weight:600}
a{color:var(--ac)}
.tel{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--tx)}
.tel b{font-size:20px;color:var(--er)}
label.l{display:block;font-size:13px;color:var(--mu);margin:0 0 3px}
.bar{height:6px;border-radius:4px;background:var(--ac2);margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ac)}
.mn{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
.mn b{text-transform:capitalize}.mn .x{font-size:28px;padding:0 14px}
a.chip{text-decoration:none}
.ic{vertical-align:-.2em;flex:none}
.chip .ic{vertical-align:-2px;margin-right:3px}
.mk{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
#app.m{padding-top:calc(env(safe-area-inset-top) + 34px);padding-bottom:calc(env(safe-area-inset-bottom) + 70px)}
html.mapmode,html.mapmode body{overflow:hidden;height:100%;overscroll-behavior:none}
#mapwrap{position:relative}
#map{height:calc(100dvh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:300px;border-radius:14px;border:1px solid var(--bd);z-index:0}
#mlines{position:absolute;top:8px;left:8px;z-index:900;display:flex;gap:4px}
.lc{height:24px;padding:0 9px;font-size:11px;font-weight:700;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--mu);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.lc.sel,.cc.sel{box-shadow:0 0 0 2px var(--tx)}
#mtools{position:absolute;top:8px;right:8px;z-index:900;display:flex;flex-direction:column;gap:8px}
.mb{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.mb.on{color:#1a73e8}
#mcross{position:absolute;left:50%;top:50%;transform:translate(-50%,-92%);z-index:900;pointer-events:none;color:var(--er)}
#mbar{position:absolute;left:8px;right:8px;bottom:22px;z-index:900;display:flex;flex-direction:column;gap:8px;align-items:stretch;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 10px;box-shadow:0 1px 6px rgba(0,0,0,.3);font-size:13px}
#mbar span{flex:1}
#mbar .btn{width:auto;flex:1;margin:0;padding:8px 14px}
.mrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cc{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:12px}
#mfilt{position:absolute;top:42px;left:8px;right:60px;z-index:900;display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;box-shadow:0 1px 6px rgba(0,0,0,.3)}
#mfilt[hidden]{display:none}
#mcross[hidden],#mbar[hidden]{display:none}
#msearch{position:absolute;top:42px;left:8px;right:60px;z-index:900;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;box-shadow:0 1px 6px rgba(0,0,0,.3)}
#msearch[hidden]{display:none}
#sres{max-height:40dvh;overflow:auto;margin-top:6px}
.sr{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--bd);padding:8px 2px}
.sr b{display:block;font-size:14px}
.sr .d{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{font-size:22px;line-height:26px;text-align:center;background:none;border:0}
.leaflet-popup-content{color:#222}.leaflet-popup-content a{color:#1f7a4d}
.seg{display:flex;gap:6px;margin:0 0 12px}
.seg button{flex:1;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
</style>
</head>
<body>
<div id="app"></div>
<div id="big" data-a="bigclose" hidden></div>
<nav id="nav"></nav>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script src="leaflet.js"></script>

const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

function dueOf(t){const o=(S.tasks[t.id]||{}).due;if(o)return o;const b=S.settings[t.rel];return b?iso(addD(parse(b),t.off)):''}
function items(){
 const o=[];
 TPL.forEach(t=>{const st=S.tasks[t.id]||{};if(st.hidden)return;o.push({key:'task-'+t.id,kind:'task',id:t.id,title:t.title,due:dueOf(t),done:!!st.done,v:t.v})});
 S.custom.forEach(c=>o.push({key:'c-'+c.id,kind:'custom',id:c.id,title:c.title,due:c.due||'',done:!!c.done}));
 S.docs.forEach(d=>{if(d.expiry)o.push({key:'doc-'+d.id,kind:'doc',id:d.id,title:'Expiration : '+d.label,due:d.expiry,done:false})});

function vToday(){

  else hero=`<div class="hero"><b>Jour ${1-n}</b>à Milan depuis le ${fmt(a)}</div>`}
 const all=items().filter(i=>i.due&&!i.done).sort((x,y)=>x.due<y.due?-1:x.due>y.due?1:0);
 const g=[['En retard',i=>diff(i.due)<0],['Cette semaine',i=>diff(i.due)>=0&&diff(i.due)<=7],['Ce mois-ci',i=>diff(i.due)>7&&diff(i.due)<=30],['Plus tard',i=>diff(i.due)>30]];
 let h=`<h1>Milano</h1><p class="sub">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</p>${hero}${backupBanner()}`;
 g.forEach(([n,f])=>{const l=all.filter(f);if(l.length)h+=`<h2>${n} (${l.length})</h2>`+l.map(itemRow).join('')});

const PRESET=[['Politecnico – campus Leonardo (position approximative)',45.4781,9.2276],['Politecnico – campus Bovisa (position approximative)',45.5028,9.1577]];

function loadNet(){try{return JSON.parse(localStorage.getItem(NKEY))}catch(e){return null}}
/*PN*/
function parseNet(json){
 const nodes={},lines={},stn={},extra=[];let skipped=0;
 (json.elements||[]).forEach(e=>{if(e.type==='node')nodes[e.id]=e});
 (json.elements||[]).forEach(e=>{
  if(e.type==='node'&&e.tags&&e.tags.station==='subway'&&e.tags.name&&e.lat!=null)extra.push({name:e.tags.name,lat:e.lat,lon:e.lon,refs:[]});
  if(e.type!=='relation')return;
  const t=e.tags||{};let ref=String(t.ref||'').trim().toUpperCase();
  if(/^\d$/.test(ref))ref='M'+ref;
  if(!/^M\d$/.test(ref)){skipped++;return}
  const L=lines[ref]||(lines[ref]={ref:ref,col:LCOL[ref]||'#555555',paths:[],seen:{}});
  (e.members||[]).forEach(m=>{
   const role=m.role||'';
   if(m.type==='way'&&m.geometry&&!/^(platform|stop)/.test(role)){
    if(!L.seen[m.ref]){L.seen[m.ref]=1;L.paths.push(m.geometry.map(p=>[Math.round(p.lat*1e5)/1e5,Math.round(p.lon*1e5)/1e5]))}
   }else if(m.type==='node'&&/^stop/.test(role)&&m.lat!=null){
    const nd=nodes[m.ref],nm=nd&&nd.tags&&nd.tags.name;if(!nm)return;
    const k=nm.toLowerCase(),s=stn[k]||(stn[k]={name:nm,la:0,lo:0,n:0,refs:[]});
    s.la+=m.lat;s.lo+=m.lon;s.n++;if(s.refs.indexOf(ref)<0)s.refs.push(ref)}
  })});
 let stations=Object.keys(stn).map(k=>{const s=stn[k];return{name:s.name,lat:Math.round(s.la/s.n*1e5)/1e5,lon:Math.round(s.lo/s.n*1e5)/1e5,refs:s.refs.sort()}});
 if(stations.length<20&&extra.length)stations=extra.map(s=>({name:s.name,lat:Math.round(s.lat*1e5)/1e5,lon:Math.round(s.lon*1e5)/1e5,refs:[]}));
 const L=Object.keys(lines).sort().map(k=>({ref:k,col:lines[k].col,paths:lines[k].paths}));
 return{ts:Date.now(),lines:L,stations:stations,skipped:skipped}}

function statusText(){const n=loadNet();if(!n)return'Réseau de transport non chargé.';
 return n.lines.length+' ligne(s), '+n.stations.length+' stations · données OpenStreetMap du '+new Date(n.ts).toLocaleDateString('fr-FR')+(n.skipped?' · '+n.skipped+' relation(s) ignorée(s)':'')}
async function fetchNet(){
 setStatus('Chargement du réseau (OpenStreetMap)… peut prendre 10 à 60 s.');
 const q='[out:json][timeout:90];rel["route"="subway"]('+BBOX+')->.r;.r out geom;node(r.r);out;node["station"="subway"]('+BBOX+');out;';
 let err='';
 for(const url of OVERPASS){
  try{
   const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),80000);
   const r=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal});
   clearTimeout(to);
   if(!r.ok){err=url.split('/')[2]+' : HTTP '+r.status;continue}
   const j=await r.json(),net=parseNet(j);
   if(!net.lines.length){err='Aucune ligne M1–M5 trouvée dans la réponse (tags OSM inattendus). Remarque serveur : '+(j.remark||'aucune');continue}
   try{localStorage.setItem(NKEY,JSON.stringify(net))}catch(e){err='Réseau chargé mais impossible à mettre en cache (stockage plein).'}
   NETMEM=net;
   if(MAP){updateLines();drawNet()}
   setStatus(statusText()+(err?' · '+err:''));return
  }catch(e){err=url.split('/')[2]+' : '+(e.name==='AbortError'?'délai dépassé':e.message)}
 }
 setStatus('Échec du chargement. '+err+' Réessaie avec le bouton Réseau.');
}

function mkBtn(txt,cls,fn){const b=document.createElement('button');b.className=cls||'btn';b.textContent=txt;b.addEventListener('click',fn);return b}
function routeLink(lat,lon){const a=document.createElement('a');a.href='https://maps.apple.com/?daddr='+lat+','+lon+'&dirflg=r';a.textContent='Itinéraire (transports) →';return a}
function popupFor(title,sub,lat,lon,extraBtn){const d=document.createElement('div');const b=document.createElement('b');b.textContent=title;d.appendChild(b);
 if(sub){const s=document.createElement('div');s.textContent=sub;s.style.margin='2px 0';d.appendChild(s)}
 d.appendChild(routeLink(lat,lon));if(extraBtn){d.appendChild(document.createElement('br'));d.appendChild(extraBtn)}return d}
function drawNet(){
 if(!MAP||!NETL)return;NETL.clearLayers();SM=[];const n=curNet();if(!n)return;
 const f=FOCUS;
 n.lines.slice().sort((a,b)=>(a.ref===f)-(b.ref===f)).forEach(l=>{const on=!f||l.ref===f;
  L.polyline(l.paths,{color:l.col,weight:on?(f?7:4):3,opacity:on?.95:.22,interactive:false}).addTo(NETL)});
 const isOn=s=>!f||s.refs.includes(f);
 n.stations.slice().sort((a,b)=>isOn(a)-isOn(b)).forEach(s=>{
  const on=isOn(s),st=stStyle(MAP.getZoom());
  const c=!on?'#999':(f?LCOL[f]:(s.refs.length?(LCOL[s.refs[0]]||'#555'):'#555'));
  const m=L.circleMarker([s.lat,s.lon],{radius:st.r,color:c,weight:st.w,opacity:on?1:.35,fillColor:'#fff',fillOpacity:on?1:.35}).addTo(NETL);
  m.bindPopup(popupFor(s.name,s.refs.join(' · '),s.lat,s.lon));SM.push(m)})}
let SM=[];
function stStyle(z){return z<=11?{r:2,w:1.5}:z===12?{r:3,w:2}:z===13?{r:4,w:2.5}:z===14?{r:5,w:3}:{r:6,w:3}}
function restyleStations(){if(!MAP)return;const st=stStyle(MAP.getZoom());SM.forEach(m=>m.setStyle({weight:st.w}).setRadius(st.r))}
function drawPlaces(){
 if(!MAP||!PLACEL)return;PLACEL.clearLayers();if(PFOCUS&&catCount(PFOCUS)===0)PFOCUS=null;
 const pin=(n,col)=>L.divIcon({html:'<div class="mk" style="background:'+col+'">'+ic(n,16)+'</div>',className:'pin',iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-14]});
 PRESET.forEach(([n,la,lo])=>L.marker([la,lo],{icon:pin(PCM.etudes.i,PCM.etudes.c),opacity:mo('etudes'),zIndexOffset:zo('etudes')}).addTo(PLACEL).bindPopup(popupFor(n,PCM.etudes.l,la,lo)));
 S.places.forEach(p=>{const c=catOf(p);
  const ex=document.createElement('div');
  const sel=document.createElement('select');sel.style.cssText='width:100%;margin:6px 0 4px;padding:6px';
  PC.forEach(x=>{const o=document.createElement('option');o.value=x.k;o.textContent=x.l;if(x.k===c.k)o.selected=true;sel.appendChild(o)});
  sel.addEventListener('change',()=>{p.cat=sel.value;save();MAP.closePopup();drawPlaces();updateFilter()});
  ex.appendChild(sel);
  ex.appendChild(mkBtn('Supprimer ce lieu','btn r',()=>{if(confirm('Supprimer « '+p.name+' » ?')){S.places=S.places.filter(x=>x.id!==p.id);save();MAP.closePopup();drawPlaces();updateFilter()}}));
  L.marker([p.lat,p.lon],{icon:pin(c.i,c.c),opacity:mo(c.k),zIndexOffset:zo(c.k)}).addTo(PLACEL).bindPopup(popupFor(p.name,c.l,p.lat,p.lon,ex))})}

let SQ='',SRES=[],SMK=null;
function localHits(q){
 q=q.trim().toLowerCase();if(q.length<2)return[];
 const out=[];
 S.places.forEach(p=>{if(p.name.toLowerCase().includes(q))out.push({n:p.name,s:catOf(p).l,la:p.lat,lo:p.lon})});
 PRESET.forEach(([n,la,lo])=>{if(n.toLowerCase().includes(q))out.push({n,s:'Études',la,lo})});
 const net=curNet();if(net)net.stations.forEach(s=>{if(s.name.toLowerCase().includes(q))out.push({n:s.name,s:'Station '+s.refs.join(' · '),la:s.lat,lo:s.lon})});
 return out.slice(0,8)}
function drawSearch(extra,msg){
 const el=document.getElementById('sres');if(!el)return;
 SRES=localHits(SQ).concat(extra||[]);
 el.innerHTML=SRES.map((r,i)=>`<button class="sr" data-a="sgo" data-id="${i}"><b>${esc(r.n)}</b><span class="d">${esc(r.s)}</span></button>`).join('')+(msg?`<div class="d" style="padding:6px 2px">${esc(msg)}</div>`:'')}
async function geoSearch(){
 const q=SQ.trim();if(q.length<3)return;
 drawSearch([],'Recherche…');
 try{
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=fr&countrycodes=it&viewbox=8.9,45.6,9.45,45.3&q='+encodeURIComponent(q));
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  drawSearch(j.map(x=>({n:x.name||x.display_name.split(',')[0],s:x.display_name,la:+x.lat,lo:+x.lon})),j.length?'':'Aucun résultat.');
 }catch(e){drawSearch([],'Recherche impossible : '+e.message)}}

async function outFile(name,text,mime){
 const f=new File([text],name,{type:mime});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return true}catch(e){if(e.name==='AbortError')return false}}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);return true}
const icsEsc=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');

 items().filter(i=>i.due&&!i.done).forEach(i=>{
  L.push('BEGIN:VEVENT','UID:'+i.key+'@milano-app','DTSTAMP:'+st,'DTSTART;VALUE=DATE:'+i.due.replace(/-/g,''),'DTEND;VALUE=DATE:'+iso(addD(parse(i.due),1)).replace(/-/g,''),
  'SUMMARY:'+icsEsc(i.title),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(i.title),'TRIGGER:-PT15H','END:VALARM','END:VEVENT')});

 if(a==='fav'){const k=S.fav.indexOf(id);if(k>=0)S.fav.splice(k,1);else S.fav.push(id);save();document.getElementById('plist').innerHTML=plist();return}
 if(a==='say'){say(b.dataset.it);return}
 if(a==='big'){const z=document.getElementById('big');z.innerHTML=`<div class="it">${esc(b.dataset.it)}</div><div class="fr">${esc(b.dataset.fr)}</div><br><button class="btn" data-a="say" data-it="${esc(b.dataset.it)}">${ic('speaker-wave',20)} Écouter</button><div class="fr">Toucher ailleurs pour fermer</div>`;z.hidden=false;return}
 if(a==='bigclose'){document.getElementById('big').hidden=true;return}
 if(a==='json'){outFile('milano-sauvegarde-'+iso(today())+'.json',JSON.stringify(S,null,1),'application/json').then(ok=>{if(ok){S.lastExport=iso(today());save();render()}});return}
 if(a==='ics'){outFile('milano-echeances.ics',buildIcs(),'text/calendar');return}
 if(a==='imp'){document.getElementById('imp').click();return}
 if(a==='reset'){if(confirm('Tout effacer ? Cette action est définitive.')){S=blank();save();render()}return}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.a==='toggle'){const id=t.dataset.id;
  if(t.dataset.k==='task'){S.tasks[id]=Object.assign({},S.tasks[id],{done:t.checked})}
  else{const c=S.custom.find(x=>x.id===id);if(c)c.done=t.checked}
  save();render();return}
 if(t.dataset.c==='taskdue'){const id=t.dataset.id;const o=Object.assign({},S.tasks[id]);if(t.value)o.due=t.value;else delete o.due;S.tasks[id]=o;save();render();return}
 if(t.dataset.a==='reimb'){const x=S.budget.exp.find(v=>v.id===t.dataset.id);if(x){x.reimb=t.checked;save();render()}return}
 if(t.dataset.c==='bset'){S.budget[t.dataset.f]=t.value;save();render();return}
 if(t.dataset.c==='set'){S.settings[t.dataset.f]=t.value;save();render()}
});
document.addEventListener('input',e=>{if(e.target.id==='pq'){q=e.target.value;document.getElementById('plist').innerHTML=plist()}});
document.addEventListener('input',e=>{if(e.target.id==='sq'){SQ=e.target.value;drawSearch()}});
document.addEventListener('keydown',e=>{if(e.target.id==='sq'&&e.key==='Enter'){e.preventDefault();geoSearch()}});
document.getElementById('imp').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.settings||!Array.isArray(o.docs))throw 0;S=Object.assign(blank(),o);save();render();alert('Import réussi.')}catch(x){alert('Fichier invalide.')}};
 r.readAsText(f);e.target.value=''});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
